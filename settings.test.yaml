# yaml-language-server: $schema=https://makeshift.github.io/github-api-json-schema/repository-settings.json

branches:
  - name: master
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
        dismissal_restrictions:
          users: []
          teams: []
      required_status_checks:
        strict: true
        contexts: []
      enforce_admins: true
      required_linear_history: true
      restrictions:
        apps: []
        users: []
        teams: []

collaborators:
  - username: bkeepers
    permission: push
  - username: hubot
    permission: pull

environments:
  - name: production
    wait_timer: 5
    reviewers:
      - id: 1
        type: Team
      - id: 2
        type: User
    deployment_branch_policy:
      protected_branches: true
  - name: development
    deployment_branch_policy:
      custom_branches:
        - main
        - dev/*
        - name: release/*
          type: branch
        - name: v*
          type: tag

labels:
  - name: bug
    color: CC0000
    description: An issue with the system.
  - name: feature
    color: '#336699'
    description: New functionality.
  - name: Help Wanted
    new_name: first-timers-only

milestones:
  - title: milestone-title
    description: milestone-description
    state: open

repository:
  name: repo-name
  description: description of repo
  homepage: https://example.github.io/
  topics: github, probot
  private: false
  has_issues: true
  has_projects: true
  has_wiki: true
  default_branch: master
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

rulesets:
  - name: prevent destruction of the default branch
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
  - name: verification must pass
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
        exclude: []
    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            - context: test
              integration_id: 123456
    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: pull_request
  - name: changes must be reviewed
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
        exclude: []
    rules:
      - type: pull_request
        parameters:
          dismiss_stale_reviews_on_push: false
          required_approving_review_count: 1
          require_code_owner_review: true
          require_last_push_approval: false
          required_review_thread_resolution: false
    bypass_actors:
      - actor_id: 654321
        actor_type: Integration
        bypass_mode: always

teams:
  - name: core
    permission: admin
  - name: docs
    permission: push
